<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="aggregate-title aggregate-desc" data-renderer="editorial-systems-figure-v2" data-theme="paper" data-palette="editorial">
  <title id="aggregate-title">Similar Macro gain, different axis profiles</title>
  <desc id="aggregate-desc">A measured comparison separates Macro relative gain from axis-level percentage-point changes. Macro relative gain is 10.93 percent locally and 10.78 percent in the paper. Local versus paper changes are Call 4.93 versus 1.40, Completion 7.04 versus negative 2.80, Slot 7.01 versus 27.80, and Relevance 5.69 versus 8.70 percentage points. The conditions are not one common effect estimate.</desc>
  <defs>
    <pattern id="aggregate-paper-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5E7FD8" stroke-width="5" opacity="0.72"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text class="figure-title" x="72" y="60" font-size="24" font-weight="600" fill="#11120F">Similar Macro gain, different axis profiles</text>

    <text x="72" y="104" font-size="18" font-weight="600" fill="#11120F">Macro relative gain (%)</text>
    <line x1="250" y1="188" x2="1030" y2="188" stroke="#B8BBB5" stroke-width="1.5"/>
    <text x="72" y="140" font-size="17" fill="#686B66">Local reconstruction</text>
    <rect x="250" y="122" width="710.45" height="22" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="973" y="140" font-size="17" font-weight="600" fill="#11120F">10.93%</text>
    <text x="72" y="177" font-size="17" fill="#686B66">Paper report</text>
    <rect x="250" y="159" width="700.70" height="22" rx="3" fill="url(#aggregate-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="963" y="177" font-size="17" font-weight="600" fill="#11120F">10.78%</text>
    <text x="250" y="210" font-size="15" fill="#686B66">0</text>
    <text x="1014" y="210" font-size="15" fill="#686B66">12</text>

    <text x="72" y="246" font-size="18" font-weight="600" fill="#11120F">Axis change (percentage points)</text>
    <rect x="472" y="232" width="24" height="14" rx="2" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.2"/>
    <text x="506" y="245" font-size="15" fill="#686B66">Local reconstruction</text>
    <rect x="690" y="232" width="24" height="14" rx="2" fill="url(#aggregate-paper-hatch)" stroke="#5E7FD8" stroke-width="1.2"/>
    <text x="724" y="245" font-size="15" fill="#686B66">Paper report</text>
    <line x1="190" y1="262" x2="190" y2="576" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="310" y1="262" x2="310" y2="576" stroke="#686B66" stroke-width="2"/>
    <line x1="550" y1="262" x2="550" y2="576" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="790" y1="262" x2="790" y2="576" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="1030" y1="262" x2="1030" y2="576" stroke="#D9DCD7" stroke-width="1"/>

    <text x="72" y="302" font-size="18" font-weight="600" fill="#11120F">Call</text>
    <rect x="310" y="269" width="118.32" height="20" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="440" y="285" font-size="16" font-weight="600" fill="#11120F">+4.93</text>
    <rect x="310" y="299" width="33.60" height="20" rx="2" fill="url(#aggregate-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="355" y="315" font-size="16" font-weight="600" fill="#11120F">+1.40</text>

    <text x="72" y="382" font-size="18" font-weight="600" fill="#11120F">Completion</text>
    <rect x="310" y="349" width="168.96" height="20" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="491" y="365" font-size="16" font-weight="600" fill="#11120F">+7.04</text>
    <rect x="242.80" y="379" width="67.20" height="20" rx="2" fill="url(#aggregate-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="232" y="395" text-anchor="end" font-size="16" font-weight="600" fill="#11120F">−2.80</text>

    <text x="72" y="462" font-size="18" font-weight="600" fill="#11120F">Slot</text>
    <rect x="310" y="429" width="168.24" height="20" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="490" y="445" font-size="16" font-weight="600" fill="#11120F">+7.01</text>
    <rect x="310" y="459" width="667.20" height="20" rx="2" fill="url(#aggregate-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="989" y="475" font-size="16" font-weight="600" fill="#11120F">+27.80</text>

    <text x="72" y="542" font-size="18" font-weight="600" fill="#11120F">Relevance</text>
    <rect x="310" y="509" width="136.56" height="20" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="459" y="525" font-size="16" font-weight="600" fill="#11120F">+5.69</text>
    <rect x="310" y="539" width="208.80" height="20" rx="2" fill="url(#aggregate-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="531" y="555" font-size="16" font-weight="600" fill="#11120F">+8.70</text>

    <line x1="190" y1="584" x2="1030" y2="584" stroke="#B8BBB5" stroke-width="1.5"/>
    <text x="190" y="611" text-anchor="middle" font-size="15" fill="#686B66">−5</text>
    <text x="310" y="611" text-anchor="middle" font-size="15" fill="#686B66">0</text>
    <text x="550" y="611" text-anchor="middle" font-size="15" fill="#686B66">10</text>
    <text x="790" y="611" text-anchor="middle" font-size="15" fill="#686B66">20</text>
    <text x="1030" y="611" text-anchor="middle" font-size="15" fill="#686B66">30 pp</text>
  </g>
</svg>
