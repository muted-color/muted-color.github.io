<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">Single-run post-hoc sensitivity deltas</title>
  <desc id="desc">A zero-centered horizontal delta chart reports prefix-synchronized DPO minus primary DPO. Call changes by negative 2.39 percentage points, Completion by negative 1.41, Slot by positive 7.69, Relevance by positive 0.81, and Macro by positive 1.18. Auxiliary rollout success remains 15 of 28 in both runs. This is a single-run sensitivity comparison in which multiple trajectory properties changed together.</desc>
  <defs>
    <style>
      text { font-family: "Plus Jakarta Sans", "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #171923; }
      .axis { font-size: 14px; fill: #717987; }
      .label { font-size: 18px; font-weight: 700; }
      .value { font-size: 16px; font-weight: 700; }
      .note { font-size: 16px; fill: #505866; }
      .caveat { font-size: 15px; fill: #626a78; }
    </style>
  </defs>
  <rect width="1100" height="590" fill="#ffffff"/>

  <g aria-label="Zero-centered delta axis">
    <line x1="360" y1="52" x2="360" y2="420" stroke="#707886" stroke-width="2"/>
    <line x1="150" y1="420" x2="990" y2="420" stroke="#cfd5df"/>
    <line x1="150" y1="52" x2="150" y2="420" stroke="#eef0f4"/>
    <line x1="220" y1="52" x2="220" y2="420" stroke="#eef0f4"/>
    <line x1="290" y1="52" x2="290" y2="420" stroke="#eef0f4"/>
    <line x1="430" y1="52" x2="430" y2="420" stroke="#eef0f4"/>
    <line x1="570" y1="52" x2="570" y2="420" stroke="#eef0f4"/>
    <line x1="710" y1="52" x2="710" y2="420" stroke="#eef0f4"/>
    <line x1="850" y1="52" x2="850" y2="420" stroke="#eef0f4"/>
    <line x1="990" y1="52" x2="990" y2="420" stroke="#eef0f4"/>
    <text x="150" y="445" text-anchor="middle" class="axis">−3</text>
    <text x="220" y="445" text-anchor="middle" class="axis">−2</text>
    <text x="290" y="445" text-anchor="middle" class="axis">−1</text>
    <text x="360" y="445" text-anchor="middle" class="axis">0</text>
    <text x="430" y="445" text-anchor="middle" class="axis">1</text>
    <text x="570" y="445" text-anchor="middle" class="axis">3</text>
    <text x="710" y="445" text-anchor="middle" class="axis">5</text>
    <text x="850" y="445" text-anchor="middle" class="axis">7</text>
    <text x="990" y="445" text-anchor="middle" class="axis">9 pp</text>
  </g>

  <g aria-label="Call delta">
    <text x="130" y="91" text-anchor="end" class="label">Call</text>
    <rect x="192.7" y="72" width="167.3" height="26" rx="6" fill="#9aa2ae"/>
    <path d="M192.7 72 l-12 13 12 13 z" fill="#9aa2ae"/>
    <text x="171" y="90" text-anchor="end" class="value">−2.39</text>
  </g>
  <g aria-label="Completion delta">
    <text x="130" y="165" text-anchor="end" class="label">Completion</text>
    <rect x="261.3" y="146" width="98.7" height="26" rx="6" fill="#9aa2ae"/>
    <path d="M261.3 146 l-12 13 12 13 z" fill="#9aa2ae"/>
    <text x="240" y="164" text-anchor="end" class="value">−1.41</text>
  </g>
  <g aria-label="Slot delta">
    <text x="130" y="239" text-anchor="end" class="label">Slot</text>
    <rect x="360" y="220" width="538.3" height="26" rx="13" fill="#3f41ff"/>
    <circle cx="360" cy="233" r="6" fill="#3f41ff"/>
    <text x="912" y="238" class="value">+7.69</text>
  </g>
  <g aria-label="Relevance delta">
    <text x="130" y="313" text-anchor="end" class="label">Relevance</text>
    <rect x="360" y="294" width="56.7" height="26" rx="13" fill="#3f41ff"/>
    <circle cx="360" cy="307" r="6" fill="#3f41ff"/>
    <text x="430" y="312" class="value">+0.81</text>
  </g>
  <g aria-label="Macro delta">
    <text x="130" y="387" text-anchor="end" class="label">Macro</text>
    <rect x="360" y="368" width="82.6" height="26" rx="13" fill="#3f41ff"/>
    <circle cx="360" cy="381" r="6" fill="#3f41ff"/>
    <text x="456" y="386" class="value">+1.18</text>
  </g>

  <g aria-label="Auxiliary rollout success unchanged">
    <rect x="176" y="466" width="748" height="78" rx="15" fill="#f7f8fa" stroke="#d9dde4"/>
    <text x="208" y="511" class="note">Auxiliary rollout exact success</text>
    <text x="591.5" y="486" text-anchor="middle" class="axis">Primary DPO</text>
    <rect x="546" y="495" width="91" height="28" rx="14" fill="#ffffff" stroke="#aab1bc"/>
    <text x="591.5" y="514" text-anchor="middle" class="value">15 / 28</text>
    <path d="M660 509 h62 M714 501 l8 8 -8 8" fill="none" stroke="#7b8491" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="791.5" y="486" text-anchor="middle" class="axis">Prefix-synchronized DPO</text>
    <rect x="746" y="495" width="91" height="28" rx="14" fill="#ffffff" stroke="#aab1bc"/>
    <text x="791.5" y="514" text-anchor="middle" class="value">15 / 28</text>
  </g>

  <text x="550" y="570" text-anchor="middle" class="caveat">Single run · prefixes, later content, tokenization, and branch lengths changed together</text>
</svg>
