<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="posthoc-title posthoc-desc" data-renderer="editorial-systems-figure-v2" data-theme="paper" data-palette="editorial">
  <title id="posthoc-title">Post-hoc sensitivity deltas</title>
  <desc id="posthoc-desc">A zero-centered measured chart reports prefix-synchronized DPO minus primary DPO. Call changes by negative 2.39 percentage points, Completion by negative 1.41, Slot by positive 7.69, Relevance by positive 0.81, and Macro by positive 1.18. Auxiliary rollout exact success remains 15 of 28 in both runs.</desc>
  <rect width="1200" height="650" fill="#FFFFFF"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text class="figure-title" x="72" y="60" font-size="24" font-weight="600" fill="#11120F">Post-hoc sensitivity deltas</text>
    <line x1="150" y1="132" x2="150" y2="468" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="218" y1="132" x2="218" y2="468" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="286" y1="132" x2="286" y2="468" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="354" y1="132" x2="354" y2="468" stroke="#686B66" stroke-width="2"/>
    <line x1="422" y1="132" x2="422" y2="468" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="558" y1="132" x2="558" y2="468" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="694" y1="132" x2="694" y2="468" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="830" y1="132" x2="830" y2="468" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="966" y1="132" x2="966" y2="468" stroke="#D9DCD7" stroke-width="1"/>

    <text x="72" y="170" font-size="18" font-weight="600" fill="#11120F">Call</text>
    <rect x="191.48" y="149" width="162.52" height="28" rx="3" fill="#D9DCD7" stroke="#686B66" stroke-width="1.5"/>
    <text x="180" y="170" text-anchor="end" font-size="17" font-weight="600" fill="#11120F">−2.39</text>

    <text x="72" y="235" font-size="18" font-weight="600" fill="#11120F">Completion</text>
    <rect x="258.12" y="214" width="95.88" height="28" rx="3" fill="#D9DCD7" stroke="#686B66" stroke-width="1.5"/>
    <text x="247" y="235" text-anchor="end" font-size="17" font-weight="600" fill="#11120F">−1.41</text>

    <text x="72" y="300" font-size="18" font-weight="600" fill="#11120F">Slot</text>
    <rect x="354" y="279" width="522.92" height="28" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="889" y="300" font-size="17" font-weight="600" fill="#11120F">+7.69</text>

    <text x="72" y="365" font-size="18" font-weight="600" fill="#11120F">Relevance</text>
    <rect x="354" y="344" width="55.08" height="28" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="421" y="365" font-size="17" font-weight="600" fill="#11120F">+0.81</text>

    <text x="72" y="430" font-size="18" font-weight="600" fill="#11120F">Macro</text>
    <rect x="354" y="409" width="80.24" height="28" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="447" y="430" font-size="17" font-weight="600" fill="#11120F">+1.18</text>

    <line x1="150" y1="476" x2="966" y2="476" stroke="#B8BBB5" stroke-width="1.5"/>
    <text x="150" y="503" text-anchor="middle" font-size="15" fill="#686B66">−3</text>
    <text x="218" y="503" text-anchor="middle" font-size="15" fill="#686B66">−2</text>
    <text x="286" y="503" text-anchor="middle" font-size="15" fill="#686B66">−1</text>
    <text x="354" y="503" text-anchor="middle" font-size="15" fill="#686B66">0</text>
    <text x="422" y="503" text-anchor="middle" font-size="15" fill="#686B66">1</text>
    <text x="558" y="503" text-anchor="middle" font-size="15" fill="#686B66">3</text>
    <text x="694" y="503" text-anchor="middle" font-size="15" fill="#686B66">5</text>
    <text x="830" y="503" text-anchor="middle" font-size="15" fill="#686B66">7</text>
    <text x="966" y="503" text-anchor="middle" font-size="15" fill="#686B66">9 pp</text>

    <rect x="150" y="535" width="816" height="76" rx="10" fill="#F1F2EF" stroke="#B8BBB5" stroke-width="1.5"/>
    <text x="178" y="567" font-size="17" font-weight="600" fill="#11120F">Auxiliary rollout exact success</text>
    <text x="178" y="592" font-size="15" fill="#686B66">Primary DPO</text>
    <text x="390" y="592" font-size="17" font-weight="600" fill="#11120F">15 / 28</text>
    <line x1="520" y1="579" x2="580" y2="579" stroke="#686B66" stroke-width="1.5"/>
    <text x="610" y="592" font-size="15" fill="#686B66">Prefix-synchronized DPO</text>
    <text x="865" y="592" font-size="17" font-weight="600" fill="#11120F">15 / 28</text>
  </g>
</svg>
