<title id="figure-title">Preference-trajectory diagnostics</title>
<desc id="figure-desc">In the local Hard Type2 partial-call subset, a shared user query reaches a divergence state where one required Slot remains in 2,521 of 2,530 pairs (99.64%), then branches to a chosen missing-field question and a rejected early tool call; their exact first-assistant surface concentrations are 8.18% and 28.50% versus 49.13% and 71.30% at top-1 and top-5.</desc>
