<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="featured-title featured-desc" data-renderer="editorial-systems-figure-v2" data-theme="paper" data-palette="editorial">
  <title id="featured-title">Similar aggregate gain, different selected changes</title>
  <desc id="featured-desc">A compact measured comparison shows Macro relative gain of 10.93 percent for the local reconstruction and 10.78 percent in the paper report. Selected axis changes show Completion at positive 7.04 versus negative 2.80 percentage points, and Slot at positive 7.01 versus positive 27.80 percentage points. Local reconstruction bars are solid and paper report bars are hatched.</desc>
  <defs>
    <pattern id="featured-paper-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#5E7FD8" stroke-width="5" opacity="0.72"/>
    </pattern>
  </defs>
  <rect width="1200" height="627" fill="#FFFFFF"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text class="figure-title" x="90" y="70" font-size="22" font-weight="600" fill="#11120F">Similar aggregate gain, different selected changes</text>

    <text x="90" y="148" font-size="18" font-weight="600" fill="#686B66">a. Macro relative gain (%)</text>
    <line x1="90" y1="187" x2="90" y2="512" stroke="#B8BBB5" stroke-width="1.5"/>
    <line x1="224" y1="187" x2="224" y2="512" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="358" y1="187" x2="358" y2="512" stroke="#D9DCD7" stroke-width="1"/>

    <text x="90" y="226" font-size="17" fill="#686B66">Local reconstruction</text>
    <rect x="90" y="242" width="244.12" height="34" rx="4" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="446" y="267" text-anchor="end" font-size="20" font-weight="600" fill="#11120F">10.93%</text>

    <text x="90" y="396" font-size="17" fill="#686B66">Paper report</text>
    <rect x="90" y="412" width="240.81" height="34" rx="4" fill="url(#featured-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="446" y="437" text-anchor="end" font-size="20" font-weight="600" fill="#11120F">10.78%</text>

    <line x1="90" y1="532" x2="358" y2="532" stroke="#B8BBB5" stroke-width="1.5"/>
    <text x="90" y="562" text-anchor="middle" font-size="16" fill="#686B66">0</text>
    <text x="224" y="562" text-anchor="middle" font-size="16" fill="#686B66">6</text>
    <text x="358" y="562" text-anchor="middle" font-size="16" fill="#686B66">12</text>

    <text x="500" y="148" font-size="18" font-weight="600" fill="#686B66">b. Selected axis changes (percentage points)</text>

    <line x1="700" y1="187" x2="700" y2="532" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="751.43" y1="187" x2="751.43" y2="532" stroke="#686B66" stroke-width="2"/>
    <line x1="854.29" y1="187" x2="854.29" y2="532" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="957.14" y1="187" x2="957.14" y2="532" stroke="#D9DCD7" stroke-width="1"/>
    <line x1="1060" y1="187" x2="1060" y2="532" stroke="#D9DCD7" stroke-width="1"/>

    <text x="500" y="207" font-size="19" font-weight="600" fill="#11120F">Completion</text>
    <text x="500" y="251" font-size="17" fill="#686B66">Local reconstruction</text>
    <rect x="751.43" y="229" width="72.41" height="28" rx="4" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="836" y="250" font-size="19" font-weight="600" fill="#11120F">+7.04</text>
    <text x="500" y="296" font-size="17" fill="#686B66">Paper report</text>
    <rect x="722.63" y="274" width="28.80" height="28" rx="3" fill="url(#featured-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="712" y="295" text-anchor="end" font-size="19" font-weight="600" fill="#11120F">−2.80</text>

    <line x1="500" y1="342" x2="1110" y2="342" stroke="#D9DCD7" stroke-width="1"/>

    <text x="500" y="386" font-size="19" font-weight="600" fill="#11120F">Slot</text>
    <text x="500" y="430" font-size="17" fill="#686B66">Local reconstruction</text>
    <rect x="751.43" y="408" width="72.10" height="28" rx="4" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="836" y="429" font-size="19" font-weight="600" fill="#11120F">+7.01</text>
    <text x="500" y="475" font-size="17" fill="#686B66">Paper report</text>
    <rect x="751.43" y="453" width="285.94" height="28" rx="3" fill="url(#featured-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="1108" y="474" text-anchor="end" font-size="19" font-weight="600" fill="#11120F">+27.80</text>

    <line x1="700" y1="532" x2="1060" y2="532" stroke="#B8BBB5" stroke-width="1.5"/>
    <text x="700" y="562" text-anchor="middle" font-size="16" fill="#686B66">−5</text>
    <text x="751.43" y="562" text-anchor="middle" font-size="16" fill="#686B66">0</text>
    <text x="854.29" y="562" text-anchor="middle" font-size="16" fill="#686B66">10</text>
    <text x="957.14" y="562" text-anchor="middle" font-size="16" fill="#686B66">20</text>
    <text x="1060" y="562" text-anchor="middle" font-size="16" fill="#686B66">30</text>
  </g>
</svg>
