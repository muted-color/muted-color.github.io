<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="aggregate-focused-title aggregate-focused-desc" data-renderer="editorial-systems-figure-v2" data-theme="paper" data-palette="editorial">
  <title id="aggregate-focused-title">Similar Macro gain, different axis profiles</title>
  <desc id="aggregate-focused-desc">A measured comparison uses a compact zero-to-twelve-percent strip for Macro relative gain and a larger zero-centered plot for axis changes. Macro relative gain is 10.93 percent locally and 10.78 percent in the paper. Local versus paper changes are Call 4.93 versus 1.40, Completion 7.04 versus negative 2.80, Slot 7.01 versus 27.80, and Relevance 5.69 versus 8.70 percentage points. The conditions are not one common effect estimate.</desc>
  <defs>
    <pattern id="aggregate-focused-paper-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5E7FD8" stroke-width="4" opacity="0.78"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text class="figure-title" x="72" y="54" font-size="24" font-weight="600" fill="#11120F">Similar Macro gain, different axis profiles</text>

    <text x="72" y="98" font-size="20" font-weight="600" fill="#686B66">a. Macro relative gain</text>
    <text x="72" y="151" font-size="19" fill="#686B66">Local reconstruction</text>
    <rect x="330" y="132" width="497.32" height="24" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="842" y="151" font-size="20" font-weight="600" fill="#11120F">10.93%</text>
    <text x="72" y="195" font-size="19" fill="#686B66">Paper report</text>
    <rect x="330" y="176" width="490.49" height="24" rx="3" fill="url(#aggregate-focused-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="835" y="195" font-size="20" font-weight="600" fill="#11120F">10.78%</text>

    <text x="72" y="280" font-size="20" font-weight="600" fill="#686B66">b. Axis changes (percentage points)</text>

    <line x1="200" y1="306" x2="200" y2="618" stroke="#D9DCD7" stroke-width="1.25"/>
    <line x1="330" y1="306" x2="330" y2="618" stroke="#11120F" stroke-width="2"/>
    <line x1="590" y1="306" x2="590" y2="618" stroke="#D9DCD7" stroke-width="1.25"/>
    <line x1="850" y1="306" x2="850" y2="618" stroke="#D9DCD7" stroke-width="1.25"/>
    <line x1="1110" y1="306" x2="1110" y2="618" stroke="#D9DCD7" stroke-width="1.25"/>

    <text x="72" y="355" font-size="20" font-weight="600" fill="#686B66">Call</text>
    <rect x="330" y="320" width="128.18" height="24" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="472" y="339" font-size="18" font-weight="600" fill="#11120F">+4.93</text>
    <rect x="330" y="354" width="36.40" height="24" rx="3" fill="url(#aggregate-focused-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="380" y="373" font-size="18" font-weight="600" fill="#11120F">+1.40</text>

    <text x="72" y="435" font-size="20" font-weight="600" fill="#11120F">Completion</text>
    <rect x="330" y="400" width="183.04" height="24" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="527" y="419" font-size="18" font-weight="600" fill="#11120F">+7.04</text>
    <rect x="257.20" y="434" width="72.80" height="24" rx="3" fill="url(#aggregate-focused-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="243" y="453" text-anchor="end" font-size="18" font-weight="600" fill="#11120F">−2.80</text>

    <text x="72" y="515" font-size="20" font-weight="600" fill="#11120F">Slot</text>
    <rect x="330" y="480" width="182.26" height="24" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="526" y="499" font-size="18" font-weight="600" fill="#11120F">+7.01</text>
    <rect x="330" y="514" width="722.80" height="24" rx="3" fill="url(#aggregate-focused-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="1066" y="533" font-size="18" font-weight="600" fill="#11120F">+27.80</text>

    <text x="72" y="595" font-size="20" font-weight="600" fill="#686B66">Relevance</text>
    <rect x="330" y="560" width="147.94" height="24" rx="3" fill="#C8D5F5" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="492" y="579" font-size="18" font-weight="600" fill="#11120F">+5.69</text>
    <rect x="330" y="594" width="226.20" height="24" rx="3" fill="url(#aggregate-focused-paper-hatch)" stroke="#5E7FD8" stroke-width="1.5"/>
    <text x="570" y="613" font-size="18" font-weight="600" fill="#11120F">+8.70</text>

    <line x1="200" y1="618" x2="1110" y2="618" stroke="#B8BBB5" stroke-width="1.5"/>
    <text x="200" y="654" text-anchor="middle" font-size="17" fill="#686B66">−5</text>
    <text x="330" y="654" text-anchor="middle" font-size="17" fill="#686B66">0</text>
    <text x="590" y="654" text-anchor="middle" font-size="17" fill="#686B66">10</text>
    <text x="850" y="654" text-anchor="middle" font-size="17" fill="#686B66">20</text>
    <text x="1110" y="654" text-anchor="middle" font-size="17" fill="#686B66">30</text>
  </g>
</svg>
