<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="figure-title figure-desc" data-renderer="editorial-systems-figure-v2" data-theme="paper" data-palette="editorial">
<title id="figure-title">From ADM measurements to training pairs</title>
<desc id="figure-desc">A four-stage flow traces 4,500 instructions from reference-conditioned response measurement through instruction-level ADM regions, pair instantiation, and region-specific SimPO evaluation. The highlighted transition marks the change from selected instructions to actual training pairs.</desc>
<rect width="1200" height="430" fill="#FFFFFF"/>
<defs><style>.system-label{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.035em}</style><pattern id="diagonal-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#EEF3FD"/><line x1="0" y1="0" x2="0" y2="10" stroke="#11120F" stroke-width="2" opacity=".35"/></pattern><pattern id="dot-pattern" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><circle cx="3" cy="3" r="1.4" fill="#11120F" opacity=".35"/></pattern><pattern id="bar-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5E7FD8" stroke-width="5" opacity=".72"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text class="figure-title" data-fit-width="1056.0" data-rendered-width="512.2" data-line-count="1" data-leading="1.22" x="72.0" y="60.0" font-size="24" font-weight="700" fill="#11120F" text-anchor="start"><tspan x="72.0" dy="0.0">From ADM measurements to training pairs</tspan></text>
<path d="M315.5 250.0H337.5" fill="none" stroke="#686B66" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M589.0 250.0H611.0" fill="none" stroke="#686B66" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M862.5 250.0H884.5" fill="none" stroke="#686B66" stroke-width="2" marker-end="url(#arrow)"/>
<g class="node"><rect x="72.0" y="140.0" width="235.5" height="220.0" rx="12" fill="#FFFFFF" stroke="#11120F" stroke-width="1.6"/><circle cx="96.0" cy="164.0" r="13" fill="#11120F"/><text class="step-index emphasis" x="96.0" y="169.5" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text><text class="node-label" data-fit-width="187.5" data-rendered-width="113.5" data-line-count="2" data-leading="1.22" x="96.0" y="210.0" font-size="22" font-weight="400" fill="#11120F" text-anchor="start"><tspan x="96.0" dy="0.0">Measure</tspan><tspan x="96.0" dy="26.8">candidates</tspan></text><text class="node-detail" data-fit-width="187.5" data-rendered-width="159.8" data-line-count="2" data-leading="1.22" x="96.0" y="274.0" font-size="18" font-weight="400" fill="#686B66" text-anchor="start"><tspan x="96.0" dy="0.0">4,500 instructions</tspan><tspan x="96.0" dy="22.0">4 responses each</tspan></text></g>
<g class="node"><rect x="345.5" y="140.0" width="235.5" height="220.0" rx="12" fill="#FFFFFF" stroke="#11120F" stroke-width="1.6"/><circle cx="369.5" cy="164.0" r="13" fill="#11120F"/><text class="step-index emphasis" x="369.5" y="169.5" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text><text class="node-label" data-fit-width="187.5" data-rendered-width="181.3" data-line-count="1" data-leading="1.22" x="369.5" y="210.0" font-size="22" font-weight="400" fill="#11120F" text-anchor="start"><tspan x="369.5" dy="0.0">Map instructions</tspan></text><text class="node-detail" data-fit-width="187.5" data-rendered-width="173.2" data-line-count="2" data-leading="1.22" x="369.5" y="248.0" font-size="18" font-weight="400" fill="#686B66" text-anchor="start"><tspan x="369.5" dy="0.0">Quality + variability</tspan><tspan x="369.5" dy="22.0">3 × 1,500 regions</tspan></text></g>
<g class="node"><rect x="619.0" y="140.0" width="235.5" height="220.0" rx="12" fill="#EEF3FD" stroke="#11120F" stroke-width="1.6"/><circle cx="643.0" cy="164.0" r="13" fill="#5E7FD8"/><text class="step-index emphasis" x="643.0" y="169.5" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text><text class="node-label" data-fit-width="187.5" data-rendered-width="181.7" data-line-count="1" data-leading="1.22" x="643.0" y="210.0" font-size="22" font-weight="400" fill="#11120F" text-anchor="start"><tspan x="643.0" dy="0.0">Instantiate pairs</tspan></text><text class="node-detail" data-fit-width="187.5" data-rendered-width="172.1" data-line-count="3" data-leading="1.22" x="643.0" y="248.0" font-size="18" font-weight="400" fill="#686B66" text-anchor="start"><tspan x="643.0" dy="0.0">Matched source ×</tspan><tspan x="643.0" dy="22.0">task quotas</tspan><tspan x="643.0" dy="22.0">17,301 training pairs</tspan></text></g>
<g class="node"><rect x="892.5" y="140.0" width="235.5" height="220.0" rx="12" fill="#FFFFFF" stroke="#11120F" stroke-width="1.6"/><circle cx="916.5" cy="164.0" r="13" fill="#11120F"/><text class="step-index emphasis" x="916.5" y="169.5" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text><text class="node-label" data-fit-width="187.5" data-rendered-width="173.4" data-line-count="1" data-leading="1.22" x="916.5" y="210.0" font-size="22" font-weight="400" fill="#11120F" text-anchor="start"><tspan x="916.5" dy="0.0">Train + evaluate</tspan></text><text class="node-detail" data-fit-width="187.5" data-rendered-width="176.4" data-line-count="3" data-leading="1.22" x="916.5" y="248.0" font-size="18" font-weight="400" fill="#686B66" text-anchor="start"><tspan x="916.5" dy="0.0">Region-specific</tspan><tspan x="916.5" dy="22.0">SimPO</tspan><tspan x="916.5" dy="22.0">Shared 600-pair set</tspan></text></g>
</g>
</svg>
