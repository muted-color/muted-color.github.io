<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">SimPO margin states</title>
<desc id="figure-desc">A horizontal interval band divides the policy margin into preference reversed, correct but below target, and target satisfied states at boundaries zero and 0.5.</desc>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.figure-title{font-size:24px;font-weight:700;fill:#11120F}.state-label{font-size:24px;font-weight:600;fill:#11120F}.range-label,.description-label,.description-detail,.direction-label,.boundary-label{font-weight:400}.range-label{font-size:18px;fill:#11120F}.description-label{font-size:17px;fill:#11120F}.description-detail{font-size:17px;fill:#686B66}.direction-label{font-size:17px;fill:#5E7FD8}.boundary-label{font-size:16px;fill:#686B66}.boundary-line{stroke:#11120F;stroke-width:2}.band-outline{stroke:#B8BBB5;stroke-width:1.5;stroke-linejoin:round}</style>
<rect width="1200" height="420" fill="#FFFFFF"/>
<text x="72" y="64" class="figure-title" font-size="24" font-weight="700">SimPO margin states</text>

<defs>
  <pattern id="neutral-hatch" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#FFFFFF"/>
    <path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#B8BBB5" stroke-width="1" opacity="0.65"/>
  </pattern>
</defs>

<text x="1128" y="116" class="direction-label" text-anchor="end">Higher policy margin →</text>
<text x="455" y="146" class="boundary-label" text-anchor="middle">Preference boundary · Delta = 0</text>
<text x="750" y="146" class="boundary-label" text-anchor="middle">Target boundary · Delta = 0.5</text>

<path d="M72 220 L96 170 H455 V270 H96 Z" fill="url(#neutral-hatch)" class="band-outline"/>
<rect x="455" y="170" width="295" height="100" fill="#EEF3FD" class="band-outline"/>
<path d="M750 170 H1104 L1128 220 L1104 270 H750 Z" fill="#C8D5F5" class="band-outline"/>
<line x1="455" y1="158" x2="455" y2="282" class="boundary-line"/>
<line x1="750" y1="158" x2="750" y2="282" class="boundary-line"/>

<text x="272" y="211" class="state-label" text-anchor="middle">R</text>
<text x="272" y="246" class="range-label" text-anchor="middle">Delta &lt;= 0</text>
<text x="602.5" y="211" class="state-label" text-anchor="middle">U</text>
<text x="602.5" y="246" class="range-label" text-anchor="middle">0 &lt; Delta &lt; 0.5</text>
<text x="927" y="211" class="state-label" text-anchor="middle">T</text>
<text x="927" y="246" class="range-label" text-anchor="middle">Delta &gt;= 0.5</text>

<text x="272" y="326" class="description-label" text-anchor="middle">Preference reversed</text>
<text x="272" y="354" class="description-detail" text-anchor="middle">Rejected response is preferred</text>
<text x="602.5" y="326" class="description-label" text-anchor="middle">Correct, below target</text>
<text x="602.5" y="354" class="description-detail" text-anchor="middle">Chosen response ranks higher</text>
<text x="927" y="326" class="description-label" text-anchor="middle">Target satisfied</text>
<text x="927" y="354" class="description-detail" text-anchor="middle">Separation reaches the target</text>
</svg>
