  <line x1="440.87" y1="150" x2="440.87" y2="286" class="grid-line"/>
  <line x1="603.91" y1="150" x2="603.91" y2="286" class="grid-line"/>
  <line x1="766.96" y1="150" x2="766.96" y2="286" class="zero-line"/>
  <line x1="930.00" y1="150" x2="930.00" y2="286" class="grid-line"/>
  <line x1="430" y1="178" x2="930" y2="178" class="row-guide"/>
  <line x1="430" y1="228" x2="930" y2="228" class="row-guide"/>
  <line x1="430" y1="278" x2="930" y2="278" class="row-guide"/>

  <text x="330" y="184" class="series-label" text-anchor="end">1.5B</text>
  <line x1="785.39" y1="178" x2="883.89" y2="178" stroke="#B8BBB5" stroke-width="3" class="data-mark"/>
  <line x1="785.39" y1="170" x2="785.39" y2="186" stroke="#686B66" stroke-width="1.6"/>
  <line x1="883.89" y1="170" x2="883.89" y2="186" stroke="#686B66" stroke-width="1.6"/>
  <circle cx="834.12" cy="178" r="8" fill="#11120F" stroke="#FFFFFF" stroke-width="1.5" class="data-mark"/>
  <text x="1070" y="184" class="value-label" text-anchor="end">+0.124</text>

  <text x="330" y="234" class="series-label" text-anchor="end">3B</text>
  <line x1="772.25" y1="228" x2="883.09" y2="228" stroke="#B8BBB5" stroke-width="3" class="data-mark"/>
  <line x1="772.25" y1="220" x2="772.25" y2="236" stroke="#686B66" stroke-width="1.6"/>
  <line x1="883.09" y1="220" x2="883.09" y2="236" stroke="#686B66" stroke-width="1.6"/>
  <circle cx="829.32" cy="228" r="8" fill="#11120F" stroke="#FFFFFF" stroke-width="1.5" class="data-mark"/>
  <text x="1070" y="234" class="value-label" text-anchor="end">+0.115</text>

  <text x="330" y="284" class="series-label" text-anchor="end">7B</text>
  <line x1="748.46" y1="278" x2="862.31" y2="278" stroke="#B8BBB5" stroke-width="3" class="data-mark"/>
  <line x1="748.46" y1="270" x2="748.46" y2="286" stroke="#686B66" stroke-width="1.6"/>
  <line x1="862.31" y1="270" x2="862.31" y2="286" stroke="#686B66" stroke-width="1.6"/>
  <circle cx="804.92" cy="278" r="8" fill="#11120F" stroke="#FFFFFF" stroke-width="1.5" class="data-mark"/>
  <text x="1070" y="284" class="value-label" text-anchor="end">+0.070</text>
</g>

