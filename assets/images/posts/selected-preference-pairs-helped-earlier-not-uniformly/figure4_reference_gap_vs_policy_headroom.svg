  <line x1="563.67" y1="496" x2="563.67" y2="512" stroke="#5E7FD8" stroke-width="1.8"/>
  <path d="M511.97 494 L521.97 504 L511.97 514 L501.97 504 Z" fill="#5E7FD8" stroke="#FFFFFF" stroke-width="1.5" class="data-mark"/>
