<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc" data-renderer="editorial-systems-figure-custom" data-palette="editorial" data-theme="paper">
<title id="figure-title">Reference score gap and distance to the next boundary</title>
<desc id="figure-desc">A shared-axis interval plot compares model-wise Spearman correlations between Random first-passage frequency across three seeds and either reference score gap or initial policy distance to the next boundary. Reference correlations cluster near zero, while boundary-distance correlations cluster near minus 0.45. Exact correlations are aligned at right.</desc>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.figure-title{font-size:24px;font-weight:700;fill:#11120F}.panel-title{font-size:19px;font-weight:400;fill:#11120F}.series-label{font-size:18px;font-weight:400;fill:#11120F}.value-label{font-size:17px;font-weight:400;fill:#11120F;font-variant-numeric:tabular-nums}.axis-tick{font-size:16px;font-weight:400;fill:#686B66}.axis-label{font-size:17px;font-weight:400;fill:#686B66}.axis-x{stroke:#686B66;stroke-width:1.5}.zero-line{stroke:#686B66;stroke-width:1.2;stroke-dasharray:5 6;opacity:.62}.grid-line{stroke:#B8BBB5;stroke-width:1;opacity:.42}.row-guide{stroke:#B8BBB5;stroke-width:1;opacity:.34}.data-mark{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="72" y="60" class="figure-title" font-size="24" font-weight="700">Reference score gap and distance to the next boundary</text>

<rect x="72" y="100" width="1056" height="210" rx="8" fill="#F1F2EF" opacity=".55"/>
<rect x="72" y="326" width="1056" height="210" rx="8" fill="#EEF3FD" opacity=".70"/>

