<rect x="1012" y="112" width="20" height="16" fill="url(#dots)" stroke="#5E7FD8" rx="2" class="data-mark"/><text x="1040" y="127" class="series-label">7B</text>
<line x1="420" y1="160" x2="420" y2="550" class="grid-line"/><text x="420" y="580" class="axis-tick" text-anchor="middle">-10</text>
