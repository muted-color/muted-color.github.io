<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Transition redistribution under HighAvg</title>
<desc id="figure-desc">Seed-42 HighAvg minus Random transition-rate differences for 1.5B, 3B, and 7B models, with pair-cluster bootstrap 95% confidence intervals.</desc>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.figure-title{font-size:24px;font-weight:700;fill:#11120F}.label,.series-label,.value-label{font-size:17px;font-weight:400;fill:#11120F}.axis-tick{font-size:16px;font-weight:400;fill:#686B66}.value-label{font-variant-numeric:tabular-nums}.axis-x{stroke:#11120F;stroke-width:1.5}.zero-line{stroke:#11120F;stroke-width:2}.grid-line{stroke:#B8BBB5;stroke-width:1;opacity:.55}.data-mark{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="72" y="64" class="figure-title" font-size="24" font-weight="700">Transition redistribution under HighAvg</text>
<defs>
  <pattern id="diag" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EEF3FD"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#5E7FD8" stroke-width="1.5"/></pattern>
  <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EEF3FD"/><circle cx="2" cy="2" r="1.4" fill="#5E7FD8"/><circle cx="6" cy="6" r="1.4" fill="#5E7FD8"/></pattern>
</defs>
<rect x="792" y="112" width="20" height="16" fill="#5E7FD8" rx="2" class="data-mark"/><text x="820" y="127" class="series-label">1.5B</text>
