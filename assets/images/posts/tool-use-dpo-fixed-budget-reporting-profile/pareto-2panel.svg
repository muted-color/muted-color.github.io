    <circle cx="365.36" cy="407.57" r="8" fill="#686B66"/><circle cx="299.26" cy="499.04" r="8" fill="#686B66"/>
    <rect x="324.31" y="262.37" width="16" height="16" fill="#5E7FD8"/><rect x="192.10" y="323.35" width="16" height="16" fill="#5E7FD8"/>
    <rect x="357.36" y="384.32" width="16" height="16" fill="#686B66"/><rect x="291.26" y="475.79" width="16" height="16" fill="#686B66"/>
  </g>

  <!-- Panel B: exact domains x [-12.5, 0.8], y [-1.3, 5.8]. -->
  <line class="grid-line" x1="726" y1="368.58" x2="1148" y2="368.58" stroke="#D9DCD7" stroke-width="1"/>
  <line class="grid-line" x1="726" y1="271.96" x2="1148" y2="271.96" stroke="#D9DCD7" stroke-width="1"/>
  <line class="grid-line" x1="726" y1="223.65" x2="1148" y2="223.65" stroke="#D9DCD7" stroke-width="1"/>
  <line class="zero-line" x1="726" y1="465.20" x2="1148" y2="465.20" stroke="#B8BBB5" stroke-width="1.8"/>
  <line class="zero-line" x1="1122.62" y1="185" x2="1122.62" y2="528" stroke="#B8BBB5" stroke-width="1.8"/>
  <line class="axis-x" data-axis-id="when2call" x1="726" y1="528" x2="1148" y2="528" stroke="#11120F" stroke-width="1.8"/>
  <line class="axis-y" data-axis-id="when2call" x1="726" y1="185" x2="726" y2="528" stroke="#11120F" stroke-width="1.8"/>

  <g stroke="#11120F" stroke-width="1.4">
    <line x1="741.86" y1="528" x2="741.86" y2="534"/><line x1="837.05" y1="528" x2="837.05" y2="534"/>
    <line x1="932.24" y1="528" x2="932.24" y2="534"/><line x1="1027.43" y1="528" x2="1027.43" y2="534"/>
    <line x1="1122.62" y1="528" x2="1122.62" y2="534"/>
    <line x1="720" y1="513.51" x2="726" y2="513.51"/><line x1="720" y1="465.20" x2="726" y2="465.20"/>
