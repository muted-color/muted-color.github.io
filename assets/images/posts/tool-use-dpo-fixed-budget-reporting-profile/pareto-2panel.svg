    <text x="120" y="290.61">4</text><text x="120" y="199.15">6</text>
  </g>
  <text x="345" y="590" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#11120F" text-anchor="middle">IFEval prompt-strict delta vs SFT (pp)</text>
  <text x="73" y="356.5" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#11120F" text-anchor="middle" transform="rotate(-90 73 356.5)">BFCL core delta vs SFT (pp)</text>

  <g fill="none" stroke-width="2.5">
    <line x1="325.31" y1="259.00" x2="176.68" y2="341.26" stroke="#5E7FD8" marker-end="url(#arrow-blue)"/>
    <line x1="325.04" y1="273.72" x2="210.09" y2="326.74" stroke="#5E7FD8" marker-end="url(#arrow-blue)"/>
    <line x1="360.67" y1="414.05" x2="305.70" y2="490.12" stroke="#686B66" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
    <line x1="360.67" y1="398.81" x2="305.70" y2="474.88" stroke="#686B66" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
