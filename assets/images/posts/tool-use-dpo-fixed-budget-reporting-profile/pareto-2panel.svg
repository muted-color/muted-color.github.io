<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="pareto-title pareto-desc" data-renderer="editorial-systems-figure-v2" data-theme="paper" data-palette="editorial">
  <title id="pareto-title">Metric trade-offs under a fixed DPO budget</title>
  <desc id="pareto-desc">Two measured scatter plots show percentage-point deltas from the same SFT baseline. The horizontal axis is IFEval prompt-strict delta. The left vertical axis is BFCL core delta and the right vertical axis is When2Call macro F1 delta. Blue solid paths represent function-call structure examples and gray dashed paths represent call-decision examples. Circles mark quality-gated conditions, squares mark ungated controls, and arrowheads point from the earlier to the final checkpoint.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5E7FD8"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#686B66"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>
  <text class="figure-title" x="72" y="64" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#11120F">Metric trade-offs under a fixed DPO budget</text>

  <!-- Legend: source uses color plus line style; filtering uses marker shape. -->
  <line x1="72" y1="103" x2="104" y2="103" stroke="#5E7FD8" stroke-width="2.5"/>
  <circle cx="88" cy="103" r="6" fill="#5E7FD8" stroke="#FFFFFF" stroke-width="2"/>
  <text class="series-label" x="114" y="109" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#11120F">Function-call structure</text>
  <line x1="296" y1="103" x2="328" y2="103" stroke="#686B66" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="312" cy="103" r="6" fill="#686B66" stroke="#FFFFFF" stroke-width="2"/>
  <text class="series-label" x="338" y="109" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#11120F">Call-decision</text>
  <circle cx="464" cy="103" r="7" fill="#FFFFFF" stroke="#11120F" stroke-width="2"/>
  <text class="series-label" x="482" y="109" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#11120F">Quality-gated</text>
  <rect x="605" y="96" width="14" height="14" fill="#FFFFFF" stroke="#11120F" stroke-width="2"/>
  <text class="series-label" x="629" y="109" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#11120F">Ungated control</text>
  <line x1="772" y1="103" x2="818" y2="103" stroke="#11120F" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text class="series-label" x="834" y="109" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#11120F">Earlier to final checkpoint</text>

  <text class="panel-title" x="92" y="137" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#11120F">A. BFCL core vs guardrail regression</text>
  <text class="panel-title" x="684" y="137" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#11120F">B. When2Call macro F1 vs guardrail regression</text>

  <!-- Panel A: exact domains x [-12.5, 0.8], y [-1.3, 6.2]. -->
  <line class="grid-line" x1="134" y1="377.08" x2="556" y2="377.08" stroke="#D9DCD7" stroke-width="1"/>
  <line class="grid-line" x1="134" y1="285.61" x2="556" y2="285.61" stroke="#D9DCD7" stroke-width="1"/>
  <line class="grid-line" x1="134" y1="194.15" x2="556" y2="194.15" stroke="#D9DCD7" stroke-width="1"/>
  <line class="zero-line" x1="134" y1="468.55" x2="556" y2="468.55" stroke="#B8BBB5" stroke-width="1.8"/>
  <line class="zero-line" x1="530.62" y1="185" x2="530.62" y2="528" stroke="#B8BBB5" stroke-width="1.8"/>
  <line class="axis-x" data-axis-id="bfcl" x1="134" y1="528" x2="556" y2="528" stroke="#11120F" stroke-width="1.8"/>
  <line class="axis-y" data-axis-id="bfcl" x1="134" y1="185" x2="134" y2="528" stroke="#11120F" stroke-width="1.8"/>

  <g stroke="#11120F" stroke-width="1.4">
    <line x1="149.86" y1="528" x2="149.86" y2="534"/><line x1="245.05" y1="528" x2="245.05" y2="534"/>
