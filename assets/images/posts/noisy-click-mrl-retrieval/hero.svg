<text x="190.00" y="119.00" font-size="22" class="panel-title" text-anchor="start" fill="#11120F" font-weight="400">Union-pool MAP@10 · KO 100 queries</text>
<line x1="190" y1="485" x2="1040" y2="485" stroke="#B8BBB5" stroke-width="1.5" class="axis-x" data-axis-id="score"/>
<line x1="190" y1="150" x2="190" y2="485" stroke="#B8BBB5" stroke-width="1.5" class="axis-y" data-axis-id="score"/>
