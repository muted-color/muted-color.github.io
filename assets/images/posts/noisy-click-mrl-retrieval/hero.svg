<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">MRL quality–storage trade-off</title>
<desc id="desc">KO 100-query union-pool MAP@10 is 0.9430 at 768 dimensions and 0.9381 at 256 dimensions. For one million fp16 vectors, storage decreases from 1536 MB to 512 MB, or one third. Vector storage excludes index overhead; encoder output remains 768-dimensional. Local MAP@10 axis 0.930–0.950. No uncertainty interval supplied.</desc>
