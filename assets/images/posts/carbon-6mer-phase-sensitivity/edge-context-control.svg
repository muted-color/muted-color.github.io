<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" data-renderer="editorial-systems-figure-v2" data-theme="paper" data-palette="editorial">
  <title id="title">Shifted-reference control distribution</title>
  <desc id="desc">Histogram of shifted-reference control ranges across 500 BRCA2 variants, with the median control-to-full-window range ratio and the fraction whose control range is at least the full-window range.</desc>
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <defs>
    <style>
      text { font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .figure-title { fill: #11120F; font-size: 24px; font-weight: 700; }
      .label { fill: #11120F; font-size: 19px; font-weight: 600; }
      .small { fill: #686B66; font-size: 18px; font-weight: 400; }
      .value { fill: #11120F; font-size: 20px; font-weight: 600; }
      .axis { stroke: #B8BBB5; stroke-width: 1.5; }
      .grid { stroke: #D9DCD7; stroke-width: 1; }
      .card { fill: #F1F2EF; stroke: #B8BBB5; stroke-width: 1; }
      .data-fill { fill: #C8D5F5; stroke: #5E7FD8; stroke-width: 1.2; }
    </style>
    
  </defs>
<text x="90" y="64" class="figure-title" font-size="24">Shifted-reference control distribution</text>
<g transform="translate(100 50)">
<line x1="100" y1="410.0" x2="900" y2="410.0" class="grid grid-line"/>
<text x="86" y="414.0" text-anchor="end" class="small">0</text>
<line x1="100" y1="357.5" x2="900" y2="357.5" class="grid grid-line"/>
<text x="86" y="361.5" text-anchor="end" class="small">25</text>
<line x1="100" y1="305.0" x2="900" y2="305.0" class="grid grid-line"/>
<text x="86" y="309.0" text-anchor="end" class="small">50</text>
<line x1="100" y1="252.5" x2="900" y2="252.5" class="grid grid-line"/>
<text x="86" y="256.5" text-anchor="end" class="small">75</text>
<line x1="100" y1="200.0" x2="900" y2="200.0" class="grid grid-line"/>
<text x="86" y="204.0" text-anchor="end" class="small">100</text>
<line x1="100" y1="95.0" x2="900" y2="95.0" class="grid grid-line"/>
<text x="86" y="99.0" text-anchor="end" class="small">150</text>
<text x="100.0" y="440" text-anchor="middle" class="small">0.00</text>
<text x="252.4" y="440" text-anchor="middle" class="small">0.02</text>
<text x="404.8" y="440" text-anchor="middle" class="small">0.04</text>
<text x="557.1" y="440" text-anchor="middle" class="small">0.06</text>
<text x="709.5" y="440" text-anchor="middle" class="small">0.08</text>
<text x="861.9" y="440" text-anchor="middle" class="small">0.10</text>
<line x1="100" y1="410" x2="900" y2="410" class="axis axis-x zero-line" data-axis-id="shifted-reference"/>
<line x1="100" y1="76" x2="100" y2="410" class="axis axis-y" data-axis-id="shifted-reference"/>
<rect x="102.0" y="410.0" width="49.3" height="0.0" rx="5" class="data-fill"/>
<rect x="155.3" y="382.7" width="49.3" height="27.3" rx="5" class="data-fill"/>
<rect x="208.7" y="118.1" width="49.3" height="291.9" rx="5" class="data-fill"/>
<rect x="262.0" y="111.8" width="49.3" height="298.2" rx="5" class="data-fill"/>
<rect x="315.3" y="300.8" width="49.3" height="109.2" rx="5" class="data-fill"/>
<rect x="368.7" y="298.7" width="49.3" height="111.3" rx="5" class="data-fill"/>
<rect x="422.0" y="368.0" width="49.3" height="42.0" rx="5" class="data-fill"/>
<rect x="475.3" y="372.2" width="49.3" height="37.8" rx="5" class="data-fill"/>
<rect x="528.7" y="363.8" width="49.3" height="46.2" rx="5" class="data-fill"/>
<rect x="582.0" y="368.0" width="49.3" height="42.0" rx="5" class="data-fill"/>
<rect x="635.3" y="397.4" width="49.3" height="12.6" rx="5" class="data-fill"/>
<rect x="688.7" y="393.2" width="49.3" height="16.8" rx="5" class="data-fill"/>
<rect x="742.0" y="401.6" width="49.3" height="8.4" rx="5" class="data-fill"/>
<rect x="795.3" y="410.0" width="49.3" height="0.0" rx="5" class="data-fill"/>
<rect x="848.7" y="403.7" width="49.3" height="6.3" rx="5" class="data-fill"/>
<text x="500.0" y="480" text-anchor="middle" class="small">Shifted-reference control range</text>
<text x="35" y="243.0" text-anchor="middle" transform="rotate(-90 35 243.0)" class="small">variant count</text>
</g>
</svg>
